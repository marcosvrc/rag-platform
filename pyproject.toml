[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-platform"
version = "0.1.0"
description = "Self-service RAG platform for document ingestion, hybrid retrieval, grounded generation, evaluation, governance, and observability."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
]

[tool.setuptools.packages.find]
include = ["apps*", "packages*", "adapters*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["apps", "packages", "adapters"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
exclude = ["^migrations/", "^\\.venv/"]

disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = """
-ra
--cov=apps
--cov=packages
--cov=adapters
--cov-report=term-missing
--cov-report=xml
"""
# Nota: o gate de cobertura mínima (--cov-fail-under) é intencionalmente
# omitido aqui em RAG-002. Com apps/packages/adapters ainda contendo apenas
# módulos vazios (0 statements), qualquer percentual fixo seria artificial.
# O relatório de cobertura já é gerado a cada execução (term-missing + XML);
# o gate numérico (ver [tool.coverage.report].fail_under) entra em vigor a
# partir do primeiro código de aplicação real (RAG-010 em diante).

[tool.coverage.run]
branch = true
source = ["apps", "packages", "adapters"]

[tool.coverage.report]
skip_empty = true
fail_under = 0  # ver nota em [tool.pytest.ini_options].addopts; elevar para 85 a partir de RAG-010.
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
