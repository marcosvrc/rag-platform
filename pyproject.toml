[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-platform"
version = "0.1.0"
description = "Self-service RAG platform for document ingestion, hybrid retrieval, grounded generation, evaluation, governance, and observability."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy>=2.0,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "pgvector>=0.3,<1",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "redis>=5.0,<6",
    # RAG-022 — fila de jobs de indexação (broker/backend Redis, já
    # configurado via `Settings.redis_url`).
    "celery>=5.4,<6",
    "httpx>=0.27,<1",
    "aioboto3>=13.0,<16",
    # RAG-050 — verificação de JWT (issuer/audience/assinatura/expiração).
    "PyJWT>=2.9,<3.0",
    # RAG-021 — FastAPI exige isso para parsear multipart/form-data
    # (upload de arquivos via UploadFile).
    "python-multipart>=0.0.9,<1.0",
    # RAG-040 — carregamento de prompts versionados (config/prompts/*.yaml)
    # em runtime, não só em ferramentas de dev/CI.
    "pyyaml>=6.0,<7.0",
    # RAG-023 — extração de conteúdo via Docling, restrita aos extras
    # leves (sem os modelos de ML de layout/OCR do pipeline de PDF, que
    # dependem de download em runtime do Hugging Face Hub/ModelScope —
    # ver README, seção RAG-023, para o motivo de PDF ficar de fora por
    # enquanto). Cobre MD, TXT (tratado como markdown trivial) e DOCX.
    "docling-slim[convert-core,format-markdown,format-docx,format-pdf]>=2.123.1,<3",
    # RAG-052 — tracing distribuído via OpenTelemetry (API, worker,
    # SQLAlchemy e Celery). Ver packages/observability/tracing.py sobre
    # por que a configuração não passa por packages.config.settings.
    "opentelemetry-api>=1.44,<2",
    "opentelemetry-sdk>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "opentelemetry-instrumentation-fastapi>=0.65b0,<1.0",
    "opentelemetry-instrumentation-celery>=0.65b0,<1.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0,<1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0",
    "pytest>=9.0.3,<10.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-asyncio>=0.23,<1.0",
    # RAG-071 — segurança no CI: SAST, SCA e o validador do arquivo de
    # exceções (security/exceptions.yml). Gitleaks e hadolint (secret
    # scanning e lint de Dockerfile) são binários externos baixados
    # diretamente no workflow, não pacotes Python.
    "bandit>=1.9,<2.0",
    "pip-audit>=2.9,<3.0",
    "types-PyYAML>=6.0,<7.0",
]

[tool.setuptools.packages.find]
include = ["apps*", "packages*", "adapters*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# FastAPI usa `Depends(...)` como valor de default de parâmetro por design
# (é assim que a injeção de dependência funciona) — B008 é um falso
# positivo aqui, não um bug.
"apps/api/**/*.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "packages", "adapters"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
exclude = ["^migrations/", "^\\.venv/"]

disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# asyncpg não publica stubs nem py.typed (RAG-005). Reavaliar se isso mudar.
module = "asyncpg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scripts.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# aioboto3/aiobotocore/botocore não publicam stubs nem py.typed (RAG-020).
module = ["aioboto3.*", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery não publica stubs nem py.typed (RAG-022). Reavaliar se isso mudar.
module = "celery.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = """
-ra
--cov=apps
--cov=packages
--cov=adapters
--cov-report=term-missing
--cov-report=xml
"""
# O gate de cobertura mínima vem de [tool.coverage.report].fail_under
# (pytest-cov usa esse valor quando --cov-fail-under não é passado aqui).
# Definido em RAG-002 como 0 (código ainda só tinha módulos vazios) e
# elevado para 85 em RAG-004, quando o primeiro código de aplicação real
# (packages/config/settings.py) passou a existir.

[tool.coverage.run]
branch = true
source = ["apps", "packages", "adapters"]

[tool.coverage.report]
skip_empty = true
fail_under = 85  # elevado em RAG-004: packages/config/settings.py é o primeiro código real (100% coberto).
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.bandit]
# RAG-071 — SAST. `tests`, `migrations` e `.venv` ficam de fora: código
# de teste e migrations geradas pelo Alembic não são superfície de
# ataque relevante, e `.venv` é dependência de terceiros já coberta
# pelo SCA (pip-audit).
exclude_dirs = ["tests", "migrations", ".venv"]

