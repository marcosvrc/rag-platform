[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-platform"
version = "0.1.0"
description = "Self-service RAG platform for document ingestion, hybrid retrieval, grounded generation, evaluation, governance, and observability."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
]

[tool.setuptools.packages.find]
include = ["apps*", "packages*", "adapters*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["apps", "packages", "adapters"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
exclude = ["^migrations/", "^\\.venv/"]

disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = """
-ra
--cov=apps
--cov=packages
--cov=adapters
--cov-report=term-missing
--cov-report=xml
"""
# O gate de cobertura mínima vem de [tool.coverage.report].fail_under
# (pytest-cov usa esse valor quando --cov-fail-under não é passado aqui).
# Definido em RAG-002 como 0 (código ainda só tinha módulos vazios) e
# elevado para 85 em RAG-004, quando o primeiro código de aplicação real
# (packages/config/settings.py) passou a existir.

[tool.coverage.run]
branch = true
source = ["apps", "packages", "adapters"]

[tool.coverage.report]
skip_empty = true
fail_under = 85  # elevado em RAG-004: packages/config/settings.py é o primeiro código real (100% coberto).
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
