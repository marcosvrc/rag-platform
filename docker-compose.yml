# rag-platform — dependências de desenvolvimento local (RAG-003).
#
# `docker compose up -d` inicia banco de dados, fila, object storage e a
# stack de observabilidade. Os serviços da aplicação (API e workers, ver
# RAG-005 em diante) ainda não fazem parte deste arquivo.
#
# Portas e credenciais têm defaults de desenvolvimento (nunca usar em
# produção); todos são configuráveis via variáveis de ambiente — copie
# .env.example para .env para customizar.
name: rag-platform

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_platform_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-rag_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-rag_platform} -d $${POSTGRES_DB:-rag_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rag_platform}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rag_platform_local_only}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    # Serve o modelo de embeddings self-hospedado (RAG-030): CPU-only,
    # sem GPU, adequado para Qwen3-Embedding-0.6B (decisão de produto
    # do RAG-030 — ver adapters/postgres/models/chunk.py). Preferido a
    # Text Embeddings Inference (TEI) para este modelo especificamente:
    # TEI teve problemas conhecidos rodando o Qwen3-Embedding-0.6B em
    # CPU (crash por falta de export ONNX/erros de Intel MKL) — Ollama
    # usa llama.cpp (GGUF), motor de inferência CPU maduro, sem essa
    # limitação.
    image: ollama/ollama:0.33.1
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama-pull-embedding-model:
    # Roda uma vez e sai: baixa o Qwen3-Embedding-0.6B (~640MB) no
    # volume `ollama_data` na primeira subida. Em subidas seguintes o
    # modelo já está local e este serviço termina quase instantaneamente
    # (`ollama pull` é idempotente). O serviço `litellm` só sobe depois
    # deste terminar com sucesso, pra nunca tentar servir com o modelo
    # ainda ausente.
    image: ollama/ollama:0.33.1
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["ollama"]
    command: ["pull", "qwen3-embedding:0.6b"]
    environment:
      OLLAMA_HOST: http://ollama:11434

  litellm:
    # Gateway de embeddings/geração (RAG-025, seção 5 do plano: "AI
    # Gateway: LiteLLM") — a aplicação só fala HTTP com este serviço
    # (adapters/litellm/), nunca diretamente com o Ollama. Config em
    # config/litellm/config.yaml mapeia o alias estável
    # `embedding-model-alias` para o modelo real (RAG-030).
    image: docker.litellm.ai/berriai/litellm:latest
    restart: unless-stopped
    command: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
    volumes:
      - ./config/litellm/config.yaml:/etc/litellm/config.yaml:ro
    environment:
      OLLAMA_API_BASE: http://ollama:11434
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    depends_on:
      ollama-pull-embedding-model:
        condition: service_completed_successfully

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.105.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_METRICS_PORT:-8889}:8889"
    # Sem healthcheck: a imagem "contrib" não tem shell/wget para sondar.
    # A prontidão é verificada pelos logs (`docker compose logs otel-collector`)
    # e, indiretamente, pelo alvo "otel-collector" ficar UP no Prometheus.

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - otel-collector
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-rag_platform_local_only}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      # RAG-053: dashboards básicos, carregados pelo provider "file" em
      # provisioning/dashboards/dashboards.yml.
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
  ollama_data:
