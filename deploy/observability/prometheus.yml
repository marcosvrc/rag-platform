# Configuração mínima do Prometheus para desenvolvimento local (RAG-003).
# O job "otel-collector" coleta as métricas que a aplicação enviar via OTLP
# (instrumentação real chega em RAG-052/RAG-053).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
