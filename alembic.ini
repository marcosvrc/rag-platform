# rag-platform — configuração do Alembic (RAG-006).
#
# A URL de conexão NÃO vem daqui: migrations/env.py a monta a partir de
# packages/config/settings.py (Pydantic Settings), para nunca versionar
# credenciais neste arquivo. O valor abaixo é só um placeholder exigido
# pelo formato do arquivo e nunca é usado de fato.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
