# RAG-070 — Workflow inicial de pull request.
#
# Automatiza qualidade, testes e validação de migrations em toda PR
# aberta contra `master`. Não inclui secret scanning/SAST/SCA (RAG-071),
# build e publicação de imagens (RAG-072) ou o quality gate de avaliação
# RAG (RAG-073) — cada um chega como atividade própria do backlog.
#
# Os jobs reproduzem exatamente `make lint` / `make typecheck` / `make
# test` (ver comentário do alvo `check` no Makefile), para que rodar a
# pipeline localmente e no CI dê o mesmo resultado — por isso cada job
# cria a própria `.venv` antes de instalar (`python -m venv .venv &&
# .venv/bin/pip install ...`), em vez de instalar no Python global do
# runner: os alvos do Makefile chamam binários em `.venv/bin/` sempre,
# tanto aqui quanto na máquina de quem desenvolve. `pip` também é
# atualizado antes da instalação (o `pip` que vem com o Python do
# runner pode ter CVEs conhecidas nele mesmo).
name: Pull Request

on:
  pull_request:
    branches:
      - master

# Permissão mínima: só leitura do conteúdo do repositório (checkout).
# Nenhum job aqui publica artefato externo, comenta na PR ou escreve
# no repositório.
permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: make lint (ruff check + ruff format --check)
        run: make lint

  typecheck:
    name: Typecheck (Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: make typecheck (mypy)
        run: make typecheck

  migrations:
    name: Validar migrations (Alembic, offline)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      # `--sql` força o modo offline do Alembic (gera o SQL das
      # migrations sem se conectar a um banco real) — as credenciais e
      # os campos de JWT abaixo são fictícios, exigidos só porque
      # Settings valida a presença de TODAS as variáveis obrigatórias
      # (RAG-004) antes de montar a URL do banco, mesmo as que este job
      # nunca usa de verdade (JWT_ISSUER/JWT_AUDIENCE, obrigatórias
      # desde o RAG-050) — sem eles, get_settings() levanta
      # ConfigurationError e o job falha antes de gerar o SQL.
      - name: alembic upgrade head --sql
        env:
          POSTGRES_PASSWORD: "ci-placeholder"
          MINIO_ROOT_PASSWORD: "ci-placeholder"
          JWT_ISSUER: "ci-placeholder"
          JWT_AUDIENCE: "ci-placeholder"
        run: .venv/bin/alembic upgrade head --sql > /dev/null

  test:
    name: Testes unitários e OpenAPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: make test (pytest + cobertura, gera coverage.xml)
        env:
          PYTEST_ADDOPTS: "--junitxml=pytest-report.xml"
        run: make test

      - name: Validar que o schema OpenAPI é gerado sem erro
        run: |
          .venv/bin/python -c "
          import json
          from apps.api.main import app

          schema = app.openapi()
          assert schema.get('openapi'), 'schema OpenAPI vazio ou inválido'
          json.dumps(schema)  # garante que é serializável
          print(f\"OpenAPI OK — {len(schema.get('paths', {}))} rota(s).\")
          "

      - name: Publicar artefatos de teste
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            pytest-report.xml
            coverage.xml
          retention-days: 14
          if-no-files-found: warn
