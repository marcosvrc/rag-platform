# RAG-074 — Automatizar deploy em DEV.
#
# Dispara quando o workflow "Publish" (RAG-072) termina com sucesso em
# `master` (`workflow_run`) — nunca reconstrói a imagem (seção 16.5 do
# plano: "não reconstruir imagem durante promoção"), sempre implanta
# exatamente o digest/tag já publicado no GHCR naquele commit
# (`sha-<sha do commit publicado>`, nunca `:latest`).
#
# ## O que "ambiente DEV" significa nesta atividade
#
# Este repositório (uma POC) não tem nenhum servidor DEV persistente
# provisionado — nenhuma credencial de cloud, Terraform ou host remoto
# existe em nenhum lugar do projeto (só o docker-compose de
# desenvolvimento local, RAG-003). "Implantar em DEV" aqui significa:
# subir a stack completa (infraestrutura + API + worker, usando a
# imagem PUBLICADA, nunca reconstruída) de forma efêmera na própria
# runner do GitHub Actions, aplicar as migrations e rodar um smoke test
# contra ela — ver o cabeçalho de `deploy/compose/docker-compose.dev.yml`
# para o racional completo. Isso satisfaz o critério de aceite desta
# atividade ("implantar digest publicado e executar smoke test") sem
# fabricar uma infraestrutura persistente que não existe; quando um
# host DEV real for provisionado, o passo "Deploy" abaixo é o único que
# muda (SSH/kubectl para o host real em vez de `docker compose` na
# runner) — a composição de serviços e o smoke test continuam os
# mesmos.
#
# "ambiente GitHub development" (critério de aceite) — satisfeito pelo
# `environment: development` do job: cria automaticamente um registro
# de Deployment do GitHub (rastreável na aba "Environments"/"Deployments"
# do repositório, com o SHA exato e o resultado da execução), sem
# nenhuma chamada manual à API de Deployments.
#
# "falha não promove release" (critério de aceite) — RAG-075 (ainda não
# implementada) deve promover só um digest cujo deploy em DEV tenha
# `conclusion: success` neste workflow (visível via a API de
# Deployments do ambiente `development`, ou pelo resultado desta run) —
# este workflow em si só tem uma responsabilidade: nunca marcar sucesso
# quando qualquer passo abaixo falhar (sem `continue-on-error` em
# nenhum passo real).
#
# ## Aviso de verificação
#
# Este workflow foi validado com `actionlint` (sintaxe/expressões) e
# revisado manualmente linha a linha contra `docker-compose.yml`
# (RAG-003) e os Dockerfiles (RAG-072), mas NUNCA rodou de verdade —
# o ambiente onde esta atividade foi implementada não tem Docker
# disponível para testar a stack de ponta a ponta. Recomenda-se
# disparar manualmente uma vez (`workflow_dispatch`, no botão "Run
# workflow") e observar o resultado antes de confiar nele em produção
# do processo de release.
name: Deploy DEV

on:
  workflow_run:
    workflows:
      - Publish
    types:
      - completed
    branches:
      - master
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-dev-${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  deploy-dev:
    name: Deploy em DEV (smoke test)
    # Só roda se o Publish (RAG-072) terminou com sucesso — uma falha de
    # build/publish não deve tentar implantar nada. `workflow_dispatch`
    # (disparo manual) não tem `workflow_run` associado, então também é
    # sempre permitido.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Determinar o SHA publicado
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout (no SHA exato publicado, não necessariamente a HEAD atual de master)
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.sha.outputs.value }}

      - name: Configurar Python (para aplicar as migrations)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Login no GHCR (GITHUB_TOKEN efêmero, sem credencial permanente)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir infraestrutura (Postgres, Redis, MinIO, Ollama, LiteLLM)
        env:
          API_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/rag-platform-api:sha-${{ steps.sha.outputs.value }}
          WORKER_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/rag-platform-worker:sha-${{ steps.sha.outputs.value }}
        run: |
          docker compose -f deploy/compose/docker-compose.dev.yml up -d --wait \
            postgres redis minio ollama ollama-pull-embedding-model litellm

      # Migrations rodam a partir do código-fonte no SHA publicado
      # (não de dentro do container: a imagem publicada não inclui
      # `migrations/`/`alembic.ini`, só o código de aplicação — RAG-072)
      # contra o Postgres da stack acima, já saudável.
      - name: Aplicar migrations (alembic upgrade head)
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: rag_platform
          POSTGRES_PASSWORD: rag_platform_dev_smoke_only
          POSTGRES_DB: rag_platform
          MINIO_ROOT_PASSWORD: rag_platform_dev_smoke_only
          JWT_ISSUER: rag-platform-dev-smoke
          JWT_AUDIENCE: rag-platform-dev-smoke-api
        run: .venv/bin/alembic upgrade head

      - name: Subir API e worker (imagem publicada, sem reconstruir)
        env:
          API_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/rag-platform-api:sha-${{ steps.sha.outputs.value }}
          WORKER_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/rag-platform-worker:sha-${{ steps.sha.outputs.value }}
        run: |
          docker compose -f deploy/compose/docker-compose.dev.yml up -d --wait api worker

      - name: Smoke test — /health/live e /health/ready
        run: |
          set -e
          live=$(curl -sS -o /tmp/live.json -w "%{http_code}" http://localhost:8000/health/live)
          echo "GET /health/live -> $live"; cat /tmp/live.json; echo
          [ "$live" = "200" ]

          ready=$(curl -sS -o /tmp/ready.json -w "%{http_code}" http://localhost:8000/health/ready)
          echo "GET /health/ready -> $ready"; cat /tmp/ready.json; echo
          [ "$ready" = "200" ]

      - name: Publicar resumo do deploy
        if: always()
        env:
          API_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/rag-platform-api:sha-${{ steps.sha.outputs.value }}
          WORKER_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/rag-platform-worker:sha-${{ steps.sha.outputs.value }}
        run: |
          {
            echo "## Deploy DEV (RAG-074)"
            echo
            echo "**Commit:** \`${{ steps.sha.outputs.value }}\`"
            echo "**Imagem da API:** \`$API_IMAGE\`"
            echo "**Imagem do worker:** \`$WORKER_IMAGE\`"
            echo "**Resultado:** ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs dos serviços (em caso de falha)
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.dev.yml logs

      - name: Encerrar a stack efêmera
        if: always()
        run: docker compose -f deploy/compose/docker-compose.dev.yml down -v
